# Omarchy-on-macOS key bindings: the single source of truth.
#
# Edit this file, then run:  omarchy-keys check  &&  omarchy-keys generate --out DIR
# The generator writes karabiner.json, OmniWM [[hotkeys]] (settings.toml),
# Hammerspoon generated/bindings.lua and KEYBINDINGS.md from it.
#
# SUPER = hold Caps Lock (Karabiner sends held right Cmd+Opt+Ctrl and sets the
# variable omarchy_super). Tap Caps alone = Escape (nothing in Citrix Viewer).
# CTRL / ALT inside a SUPER chord mean the physical LEFT Control / LEFT Option.
#
# Each [[bind]]:
#   chord  = "SUPER+SHIFT+1"   modifiers SUPER SHIFT CTRL ALT, then one key:
#            A-Z 0-9 RETURN SPACE TAB ESCAPE BACKSPACE FORWARDDELETE LEFT RIGHT UP DOWN
#            MINUS EQUAL GRAVE COMMA PERIOD SLASH BACKSLASH BRACKETLEFT BRACKETRIGHT
#            SEMICOLON APOSTROPHE HOME END PAGEUP PAGEDOWN PRINT
#   desc   = "what it does"
#   exactly one of:
#     wm   = "<omniwmctl command args>"   e.g. "switch-workspace 1"
#     wmx  = "<omarchy-wm verb args>"     e.g. "move-follow 1", "resize x +"
#     hs   = "<hammerspoon action>"       (+ optional arg = "...")
#     keys = "<chord to emit>"            e.g. "cmd+c", "ctrl+opt+shift+cmd+v"
#   repeat = true                          (optional; key repeat while held. HS chords
#                                           repeat through hs.hotkey; KB chords with
#                                           repeat become KE: Karabiner emits a bridge
#                                           chord Ctrl+Opt+Cmd(+Shift)+F16..F19 that
#                                           Hammerspoon binds with repeat (not in Citrix
#                                           Viewer, where they fire once). OmniWM-native
#                                           chords always repeat)
#   group  = "Windows"                     (optional; applies to this and the
#                                           following binds until changed)
#
# Owners are decided by the generator, never by hand:
#   OW  SUPER / SUPER+SHIFT chord whose wm command is one native OmniWM action
#   HS  other SUPER / SUPER+SHIFT chords (Hammerspoon hs.hotkey)
#   KB  any chord with CTRL or ALT added to SUPER, and PRINT (Karabiner shell_command)
#   KE  keys = ... (Karabiner emits the chord), and repeating KB chords (bridge)
# In Citrix Viewer every SUPER binding is served by Karabiner instead.
# Unbound keys in every SUPER layer are swallowed. Never bind Ctrl+Alt+Delete.

# ============================================================================
# Navigation: launcher, menus, system
# ============================================================================

[[bind]]
group = "Navigation"
chord = "SUPER+SPACE"
desc = "Omarchy menu (apps and commands)"
hs = "menu"

[[bind]]
chord = "SUPER+ALT+SPACE"
desc = "App grid (OmniWM app palette)"
wm = "open-command-palette applications"

[[bind]]
chord = "SUPER+ESCAPE"
desc = "System menu (lock, sleep, log out, restart, shut down)"
hs = "menu-system"

[[bind]]
chord = "SUPER+K"
desc = "Show key bindings"
hs = "keybindings"

# macOS addition: the menu bar is hidden behind the Omarchy bar, so search it instead.
[[bind]]
chord = "SUPER+SLASH"
desc = "Search the current app's menus (File, Edit, Export...)"
hs = "app-menu"

# SKIPPED: SUPER+ALT+K  "Tmux key bindings" (tmux is not installed)
# [[bind]]
# chord = "SUPER+ALT+K"
# desc = "Tmux key bindings"
# hs = "keybindings"
# arg = "tmux"

[[bind]]
chord = "SUPER+CTRL+K"
desc = "Herdr key bindings"
hs = "keybindings"
arg = "herdr"

[[bind]]
chord = "SUPER+CTRL+L"
desc = "Lock screen"
keys = "ctrl+cmd+q"


